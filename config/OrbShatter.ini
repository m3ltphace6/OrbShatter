; Orb Shatter - configuration
; Read once when the game starts. Restart the game after editing.
; Missing or invalid values fall back to the defaults shown here.

[General]
; false = the mod does nothing (vanilla orb behavior).
Enabled = true

[Targeting]
; Offensive orbs may also attack destructible containers (barrels, crates...).
AttackContainers = true
; Offensive orbs may also attack other destructibles (cracks, breakable walls...).
; Priority when several kinds are in view: enemies > these > containers.
AttackNonContainerDestructibles = false

[Diagnostics]
; Writes OrbShatter.log next to this file (short, capped).
Log = true

[Experimental]
; Advanced. Leave on unless a conflict with another DSDLL is suspected.
SubstituteHasMind = true
SubstituteGetMind = true
